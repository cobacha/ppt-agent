# Style Presets Configuration
# Each preset defines fonts, colors, and signature design elements

bold-signal:
  name: 醒目信号
  vibe: 自信、大胆、现代、高冲击力
  fonts:
    display: Archivo Black
    body: Space Grotesk
    source: google
  colors:
    bg_primary: "#1a1a1a"
    bg_gradient: "linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 50%, #1a1a1a 100%)"
    card_bg: "#FF5722"
    text_primary: "#ffffff"
    accent: "#FF5722"
    accent_warm: "#FF8A50"
    text_dim: "rgba(255,255,255,0.6)"
    border_subtle: "rgba(255,255,255,0.10)"
  signature:
    - Bold colored card as focal point
    - Large section numbers (01, 02, etc.)
    - Grid-based precise alignment
  visual_kit:
    typography_scale:
      h1: "clamp(2.8rem, 7vw, 5.5rem)"
      h2: "clamp(1.8rem, 4vw, 3rem)"
      h3: "clamp(1.15rem, 2vw, 1.5rem)"
      body: "clamp(0.95rem, 1.4vw, 1.2rem)"
      caption: "clamp(0.7rem, 1.05vw, 0.85rem)"
      number: "clamp(4rem, 9vw, 7rem)"
      weight_display: 900
      weight_body: 500
      letter_spacing_display: "-0.04em"
      line_height_display: "0.95"
      line_height_body: "1.5"
    bg_motif_hero: "background: linear-gradient(135deg,#1a1a1a 0%,#2d2d2d 50%,#1a1a1a 100%); position: relative;"
    bg_motif_content: "background: #1a1a1a; position: relative;"
    accent_shapes:
      - name: orange-block
        css: "background:#FF5722;color:#ffffff;font-weight:900;letter-spacing:-0.03em;"
      - name: massive-number
        css: "font-family:'Archivo Black',sans-serif;font-size:clamp(4rem,9vw,7rem);font-weight:900;line-height:0.9;letter-spacing:-0.06em;color:#FF5722;"
      - name: thick-rule
        css: "height:6px;width:clamp(40px,8vw,80px);background:#FF5722;"
      - name: dot-grid
        css: "position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,87,34,0.08) 1px,transparent 1px);background-size:32px 32px;pointer-events:none;"
    shadow_stack:
      card: "8px 8px 0 #FF5722"
      panel: "0 30px 80px rgba(0,0,0,0.7)"
    spacing_tokens:
      page_padding: "clamp(2.5rem, 6vw, 4.5rem)"
      block_gap: "clamp(1.5rem, 3vh, 2.5rem)"
      inline_gap: "clamp(0.8rem, 1.5vw, 1.2rem)"
    signature_recipes:
      - "Massive section number (01, 02) using massive-number recipe — bold focal anchor"
      - "Hard offset shadow on cards (8px 8px 0 accent) — graphic editorial feel"
      - "One full-bleed accent-color block per slide containing a key word/number"
      - "Strict geometric alignment to a 12-column grid — never centered, always intentional offset"

electric-studio:
  name: 电子工坊
  vibe: 科技、简洁、专业、高对比
  fonts:
    display: Manrope
    body: Manrope
    source: google
  colors:
    bg_primary: "#0a0a0a"
    bg_white: "#ffffff"
    accent: "#4361ee"
    accent_violet: "#7c3aed"
    text_primary: "#ffffff"
    text_dim: "rgba(255,255,255,0.62)"
    border_subtle: "rgba(255,255,255,0.08)"
  signature:
    - Two-panel vertical split
    - Accent bar on panel edge
    - Minimal confident spacing
  visual_kit:
    typography_scale:
      h1: "clamp(2.4rem, 5.5vw, 4.5rem)"
      h2: "clamp(1.6rem, 3.4vw, 2.6rem)"
      h3: "clamp(1.1rem, 1.9vw, 1.5rem)"
      body: "clamp(0.9rem, 1.35vw, 1.15rem)"
      caption: "clamp(0.7rem, 1.05vw, 0.85rem)"
      number: "clamp(3rem, 7vw, 5.5rem)"
      weight_display: 700
      weight_body: 400
      letter_spacing_display: "-0.025em"
      line_height_display: "1.05"
      line_height_body: "1.55"
    bg_motif_hero: "background: radial-gradient(ellipse at 25% 18%, rgba(67,97,238,0.20) 0%, transparent 55%), radial-gradient(ellipse at 78% 82%, rgba(124,58,237,0.13) 0%, transparent 55%), #0a0a0a;"
    bg_motif_content: "background: linear-gradient(180deg, #0a0a0a 0%, #0e0e16 100%); position: relative;"
    accent_shapes:
      - name: gradient-orb
        css: "position:absolute;width:clamp(200px,32vw,420px);height:clamp(200px,32vw,420px);border-radius:50%;filter:blur(90px);background:radial-gradient(circle,#4361ee 0%,transparent 70%);opacity:0.32;pointer-events:none;"
      - name: accent-bar
        css: "width:clamp(48px,6vw,72px);height:3px;background:linear-gradient(90deg,#4361ee 0%,#7c3aed 100%);border-radius:2px;"
      - name: hairline-divider
        css: "height:1px;background:linear-gradient(90deg,transparent,rgba(67,97,238,0.5),transparent);"
      - name: grid-overlay
        css: "position:absolute;inset:0;background-image:linear-gradient(rgba(67,97,238,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(67,97,238,0.04) 1px,transparent 1px);background-size:64px 64px;pointer-events:none;"
    shadow_stack:
      card: "0 1px 2px rgba(0,0,0,0.4), 0 12px 32px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.04)"
      panel: "0 24px 60px rgba(0,0,0,0.55)"
    spacing_tokens:
      page_padding: "clamp(2.5rem, 6vw, 4.5rem)"
      block_gap: "clamp(1.5rem, 3vh, 2.5rem)"
      inline_gap: "clamp(0.8rem, 1.5vw, 1.2rem)"
    signature_recipes:
      - "Eyebrow above h1: uppercase small caps in accent color, letter-spacing 0.2em, font-size caption"
      - "Numbered marker: large display-weight number (use number scale) with -0.05em tracking, accent color, low opacity 0.85"
      - "Card border: 1px solid border_subtle + shadow_stack.card; on hover translateY(-2px) + accent border"
      - "At least one gradient-orb decorative element on hero/content slides; never on closing"

